name: Monthly data refresh

on:
  schedule:
    - cron: "0 3 1 * *"  # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monthly-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Each fetch step gets continue-on-error so one source's outage (e.g. a GFW
      # API 504, which previously aborted the whole job before anything was
      # committed — see fetch_deforestation.py's retry/per-species-skip logic)
      # doesn't block the other, unrelated fetches or lose data they already
      # wrote. The final "Check for fetch failures" step still fails the job
      # overall so a degraded run stays visible in the Actions history.
      - name: Fetch deforestation alerts for all species
        id: fetch-deforestation
        continue-on-error: true
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
        run: python3 scripts/fetch_deforestation.py

      - name: Fetch literature
        id: fetch-literature
        continue-on-error: true
        env:
          # Required since OpenAlex stopped keyless cursor paging (the
          # 2026-11-01 run shrank the list from 600 to 200 journal articles).
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/fetch_literature.py

      - name: Fetch threats (oil palm / mining / hydro)
        id: fetch-threats
        continue-on-error: true
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
        run: python3 scripts/fetch_threats.py

      # Both data/fire/*.geojson and data/deforestation/*.geojson are rolling
      # windows that get overwritten on every refresh — this freezes last
      # month's alerts into a permanent data/archive/ snapshot before that
      # happens again. Runs after fetch-deforestation (needs today's fresh
      # deforestation file) — the day's fire file is already fresh too, since
      # daily_fire_refresh.yml runs at 02:00 UTC, an hour before this job.
      - name: Archive last month's fire + deforestation alerts
        id: archive-alerts
        continue-on-error: true
        run: python3 scripts/archive_alerts.py

      # Per-protected-area counts (see scripts/compute_pa_alerts.py's
      # docstring for why this queries GFW directly per area rather than
      # spatially joining the point-capped deforestation file).
      - name: Compute per-protected-area alert counts
        id: compute-pa-alerts
        continue-on-error: true
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
        run: python3 scripts/compute_pa_alerts.py

      - name: Commit and push if data changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deforestation/ data/literature/ data/threats/ data/archive/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Check for fetch failures
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.fetch-deforestation.outcome }}" "${{ steps.fetch-literature.outcome }}" "${{ steps.fetch-threats.outcome }}" "${{ steps.archive-alerts.outcome }}" "${{ steps.compute-pa-alerts.outcome }}"; do
            [ "$outcome" = "failure" ] && failed=1
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more fetch steps failed — see their logs above. Any data that did succeed has still been committed."
            exit 1
          fi
